services:
  axochat:
    image: ${AXOCHAT_IMAGE:-axochat}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_ADDR: 0.0.0.0:80
      # cloudflared shares this container's network
      TRUSTED_PROXIES: 127.0.0.1/32
    # certificate files in the data directory are found by their relative names
    working_dir: /data
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - 7886:7886
    mem_limit: 1g
    memswap_limit: 1g

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    network_mode: service:axochat
    mem_limit: 256m
    memswap_limit: 256m
